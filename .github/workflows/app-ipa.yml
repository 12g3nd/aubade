name: Build Aubade IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build for iOS
        # Release rather than Debug: on recent Xcode a Debug iOS build is split into a
        # separate .debug.dylib, which is awkward to sideload. Release produces a single
        # self-contained executable.
        run: |
          set -o pipefail
          xcodebuild build \
            -project app/Aubade.xcodeproj \
            -scheme Aubade \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            | tail -30

      - name: Verify the product before packaging it
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/Aubade.app"
          test -d "$APP" || { echo "no Aubade.app produced"; exit 1; }
          test -x "$APP/Aubade" || { echo "no executable"; exit 1; }
          test -f "$APP/Assets.car" || { echo "no app icon"; exit 1; }
          grep -qa "AppIcon" "$APP/Assets.car" || { echo "AppIcon missing"; exit 1; }
          FONTS=$(find "$APP" -name '*.ttf' | wc -l | tr -d ' ')
          test "$FONTS" -ge 4 || { echo "only $FONTS fonts bundled"; exit 1; }
          echo "verified: executable, icon, $FONTS fonts"
          file "$APP/Aubade"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          rm -rf Payload && mkdir -p Payload
          ditto "build/Build/Products/Release-iphoneos/Aubade.app" "Payload/Aubade.app"
          /usr/bin/zip -qry Aubade-unsigned.ipa Payload
          /usr/bin/unzip -t Aubade-unsigned.ipa > /dev/null
          ls -lh Aubade-unsigned.ipa

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Aubade-unsigned-ipa
          path: Aubade-unsigned.ipa
          if-no-files-found: error
