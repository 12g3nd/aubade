name: Core tests

on:
  workflow_dispatch:
  push:
    paths:
      - "core/**"
      - ".github/workflows/core-tests.yml"
  pull_request:
    paths:
      - "core/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Build
        working-directory: core
        run: swift build -v
      - name: Test
        working-directory: core
        run: swift test
